name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: [self-hosted, Linux, X64, luad-linux]
    steps:
    - uses: actions/checkout@v4
    - name: Confirm Linux Runner
      shell: bash
      run: |
        test "${RUNNER_OS}" = "Linux"
        test "${RUNNER_ARCH}" = "X64"
    - name: Check Licenses and Advisories
      uses: EmbarkStudios/cargo-deny-action@v2.1.1
      with:
        arguments: --locked
        command: check advisories licenses

  release-sbom:
    name: Release SBOM
    runs-on: [self-hosted, Linux, X64, luad-linux]
    steps:
    - uses: actions/checkout@v4

    - name: Confirm Linux Runner
      shell: bash
      run: |
        test "${RUNNER_OS}" = "Linux"
        test "${RUNNER_ARCH}" = "X64"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1

    - name: Install Pinned cargo-cyclonedx
      shell: bash
      run: |
        archive="${RUNNER_TEMP}/cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz"
        tool_root="${RUNNER_TEMP}/cargo-cyclonedx"
        curl --fail --location --silent --show-error \
          --output "${archive}" \
          https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz
        echo "fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8  ${archive}" \
          | sha256sum --check --strict
        mkdir -p "${tool_root}"
        tar -xJf "${archive}" --strip-components=1 -C "${tool_root}"
        test "$("${tool_root}/cargo-cyclonedx" cyclonedx --version)" \
          = "cargo-cyclonedx-cyclonedx 0.5.9"
        echo "CARGO_CYCLONEDX=${tool_root}/cargo-cyclonedx" >> "${GITHUB_ENV}"

    - name: Generate and Compare Clean-Checkout SBOMs
      shell: bash
      run: |
        source_one="${RUNNER_TEMP}/luad-sbom-source-one"
        source_two="${RUNNER_TEMP}/luad-sbom-source-two"
        output_one="${RUNNER_TEMP}/luad-sbom-one"
        output_two="${RUNNER_TEMP}/luad-sbom-two"
        export CARGO_TARGET_DIR="${RUNNER_TEMP}/luad-sbom-target"

        git clone --quiet --no-hardlinks "${GITHUB_WORKSPACE}" "${source_one}"
        git clone --quiet --no-hardlinks "${GITHUB_WORKSPACE}" "${source_two}"
        "${source_one}/scripts/generate-release-sbom.sh" "${output_one}"
        "${source_two}/scripts/generate-release-sbom.sh" "${output_two}"

        version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
        sbom="luad-${version}.cdx.json"
        cmp "${output_one}/${sbom}" "${output_two}/${sbom}"
        mkdir -p artifacts/release-sbom
        cp "${output_one}/${sbom}" artifacts/release-sbom/

    - name: Upload Diagnostic SBOM
      uses: actions/upload-artifact@v4
      with:
        name: release-sbom
        path: artifacts/release-sbom/
        if-no-files-found: error
        retention-days: 7

  release-archive-build:
    name: Release Archive Build (${{ matrix.platform }}, replica ${{ matrix.replica }})
    runs-on: [self-hosted, "${{ matrix.runner_os }}", "${{ matrix.runner_arch }}", "${{ matrix.runner_label }}"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner_os: Linux
            runner_arch: X64
            runner_label: luad-linux
            target_triple: x86_64-unknown-linux-gnu
            replica: one
          - platform: linux-x86_64
            runner_os: Linux
            runner_arch: X64
            runner_label: luad-linux
            target_triple: x86_64-unknown-linux-gnu
            replica: two
          - platform: macos-aarch64
            runner_os: macOS
            runner_arch: ARM64
            runner_label: luad-macos
            target_triple: aarch64-apple-darwin
            replica: one
          - platform: macos-aarch64
            runner_os: macOS
            runner_arch: ARM64
            runner_label: luad-macos
            target_triple: aarch64-apple-darwin
            replica: two

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1

    - name: Confirm Release Host
      shell: bash
      run: |
        test "${RUNNER_OS}" = "${{ matrix.runner_os }}"
        test "${RUNNER_ARCH}" = "${{ matrix.runner_arch }}"
        host="$(rustc -vV | sed -n 's/^host: //p')"
        test "${host}" = "${{ matrix.target_triple }}"

    - name: Build, Verify, Install, and Smoke Archive
      shell: bash
      run: |
        source_dir="${RUNNER_TEMP}/luad-release-source-${{ matrix.replica }}"
        output_dir="${RUNNER_TEMP}/luad-release-output"
        result="${RUNNER_TEMP}/luad-release-result.json"

        git clone --quiet --no-hardlinks "${GITHUB_WORKSPACE}" "${source_dir}"
        "${source_dir}/scripts/package-release.sh" "${output_dir}" >"${result}"

        version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
        stem="luad-${version}-${{ matrix.platform }}"
        expected="$(printf '%s\n' \
          SHA256SUMS \
          "${stem}.installation.json" \
          "${stem}.ledger.json" \
          "${stem}.tar.gz" | LC_ALL=C sort)"
        actual="$(find "${output_dir}" -mindepth 1 -maxdepth 1 -type f \
          -exec basename {} \; | LC_ALL=C sort)"
        test "${actual}" = "${expected}"

        artifact_dir="artifacts/release-archive"
        mkdir -p "${artifact_dir}"
        cp "${output_dir}/SHA256SUMS" "${artifact_dir}/"
        cp "${output_dir}/${stem}.installation.json" "${artifact_dir}/"
        cp "${output_dir}/${stem}.ledger.json" "${artifact_dir}/"
        cp "${output_dir}/${stem}.tar.gz" "${artifact_dir}/"

    - name: Upload Release Archive Replica
      uses: actions/upload-artifact@v4
      with:
        name: release-archive-${{ matrix.platform }}-${{ matrix.replica }}
        path: artifacts/release-archive/
        if-no-files-found: error
        retention-days: 7

  release-archives:
    name: Release Archives
    needs: release-archive-build
    runs-on: [self-hosted, Linux, X64, luad-linux]
    steps:
    - uses: actions/checkout@v4

    - name: Confirm Linux Runner
      shell: bash
      run: |
        test "${RUNNER_OS}" = "Linux"
        test "${RUNNER_ARCH}" = "X64"

    - name: Download Linux Replica One
      uses: actions/download-artifact@v4
      with:
        name: release-archive-linux-x86_64-one
        path: replicas/linux-x86_64-one

    - name: Download Linux Replica Two
      uses: actions/download-artifact@v4
      with:
        name: release-archive-linux-x86_64-two
        path: replicas/linux-x86_64-two

    - name: Download macOS Replica One
      uses: actions/download-artifact@v4
      with:
        name: release-archive-macos-aarch64-one
        path: replicas/macos-aarch64-one

    - name: Download macOS Replica Two
      uses: actions/download-artifact@v4
      with:
        name: release-archive-macos-aarch64-two
        path: replicas/macos-aarch64-two

    - name: Compare Replicas and Assemble Checksums
      shell: bash
      run: |
        version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
        accepted="artifacts/release-archives"
        mkdir -p "${accepted}"

        for platform in linux-x86_64 macos-aarch64; do
          first="replicas/${platform}-one"
          second="replicas/${platform}-two"
          stem="luad-${version}-${platform}"
          expected="$(printf '%s\n' \
            SHA256SUMS \
            "${stem}.installation.json" \
            "${stem}.ledger.json" \
            "${stem}.tar.gz" | LC_ALL=C sort)"
          for replica in "${first}" "${second}"; do
            actual="$(find "${replica}" -mindepth 1 -maxdepth 1 -type f \
              -exec basename {} \; | LC_ALL=C sort)"
            test "${actual}" = "${expected}"
            (cd "${replica}" && sha256sum --check --strict SHA256SUMS)
          done

          cmp "${first}/SHA256SUMS" "${second}/SHA256SUMS"
          cmp "${first}/${stem}.installation.json" \
            "${second}/${stem}.installation.json"
          cmp "${first}/${stem}.ledger.json" "${second}/${stem}.ledger.json"
          cmp "${first}/${stem}.tar.gz" "${second}/${stem}.tar.gz"

          cp "${first}/${stem}.installation.json" "${accepted}/"
          cp "${first}/${stem}.ledger.json" "${accepted}/"
          cp "${first}/${stem}.tar.gz" "${accepted}/"
        done

        (
          cd "${accepted}"
          sha256sum "luad-${version}-linux-x86_64.tar.gz" \
            "luad-${version}-macos-aarch64.tar.gz" | LC_ALL=C sort >SHA256SUMS
          sha256sum --check --strict SHA256SUMS
        )

        probe="${RUNNER_TEMP}/release-archive-corruption-probe"
        cp -R "${accepted}" "${probe}"
        printf '\000' | dd \
          of="${probe}/luad-${version}-linux-x86_64.tar.gz" \
          bs=1 seek=0 count=1 conv=notrunc status=none
        if cmp "${accepted}/luad-${version}-linux-x86_64.tar.gz" \
          "${probe}/luad-${version}-linux-x86_64.tar.gz"; then
          echo "corrupted archive unexpectedly passed byte comparison" >&2
          exit 1
        fi
        if (cd "${probe}" && sha256sum --check --strict SHA256SUMS); then
          echo "corrupted archive unexpectedly passed checksum verification" >&2
          exit 1
        fi

        expected="$(printf '%s\n' \
          SHA256SUMS \
          "luad-${version}-linux-x86_64.installation.json" \
          "luad-${version}-linux-x86_64.ledger.json" \
          "luad-${version}-linux-x86_64.tar.gz" \
          "luad-${version}-macos-aarch64.installation.json" \
          "luad-${version}-macos-aarch64.ledger.json" \
          "luad-${version}-macos-aarch64.tar.gz" | LC_ALL=C sort)"
        actual="$(find "${accepted}" -mindepth 1 -maxdepth 1 -type f \
          -exec basename {} \; | LC_ALL=C sort)"
        test "${actual}" = "${expected}"

    - name: Upload Diagnostic Release Archives
      uses: actions/upload-artifact@v4
      with:
        name: release-archives
        path: artifacts/release-archives/
        if-no-files-found: error
        retention-days: 7

  release-bundle:
    name: Release Bundle
    needs:
      - dependency-audit
      - release-sbom
      - release-archives
      - test
    runs-on: [self-hosted, Linux, X64, luad-linux]
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Confirm Linux Runner
      shell: bash
      run: |
        test "${RUNNER_OS}" = "Linux"
        test "${RUNNER_ARCH}" = "X64"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1

    - name: Download Release Archives
      uses: actions/download-artifact@v4
      with:
        name: release-archives
        path: ${{ runner.temp }}/release-archives

    - name: Download Release SBOM
      uses: actions/download-artifact@v4
      with:
        name: release-sbom
        path: ${{ runner.temp }}/release-sbom

    - name: Assemble, Compare, and Verify Release Bundle
      shell: bash
      env:
        DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        HOSTED_ARCHIVES_RESULT: ${{ needs.release-archives.result }}
        LOCAL_ARCHIVE_RESULT: ${{ needs.test.result }}
        RELEASE_SBOM_RESULT: ${{ needs.release-sbom.result }}
      run: |
        version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        prerequisites="${RUNNER_TEMP}/release-prerequisites.json"
        first="${RUNNER_TEMP}/release-bundle-one"
        second="${RUNNER_TEMP}/release-bundle-two"
        archive_dir="${RUNNER_TEMP}/release-archives"
        sbom="${RUNNER_TEMP}/release-sbom/luad-${version}.cdx.json"

        python3 - "${GITHUB_SHA}" "${run_url}" "${DEPENDENCY_AUDIT_RESULT}" "${HOSTED_ARCHIVES_RESULT}" "${LOCAL_ARCHIVE_RESULT}" "${RELEASE_SBOM_RESULT}" "${prerequisites}" <<'PY'
        import json
        import pathlib
        import sys

        revision, run_url = sys.argv[1:3]
        results = [
            {
                "evidence_id": "dependency-audit",
                "check_name": "Dependency Audit",
                "source_revision": revision,
                "conclusion": sys.argv[3],
                "result_url": run_url,
            },
            {
                "evidence_id": "hosted-release-archives",
                "check_name": "Release Archives",
                "source_revision": revision,
                "conclusion": sys.argv[4],
                "result_url": run_url,
            },
            {
                "evidence_id": "local-release-archive",
                "check_name": "Test (ubuntu-latest)",
                "source_revision": revision,
                "conclusion": sys.argv[5],
                "result_url": run_url,
            },
            {
                "evidence_id": "release-sbom",
                "check_name": "Release SBOM",
                "source_revision": revision,
                "conclusion": sys.argv[6],
                "result_url": run_url,
            },
        ]
        document = {"schema_version": 1, "results": results}
        pathlib.Path(sys.argv[7]).write_text(
            json.dumps(document, indent=2) + "\n",
            encoding="utf-8",
        )
        PY

        ./scripts/assemble-release-bundle.sh "${archive_dir}" "${sbom}" "${prerequisites}" "${first}"
        ./scripts/assemble-release-bundle.sh "${archive_dir}" "${sbom}" "${prerequisites}" "${second}"

        expected="$(printf '%s\n' SHA256SUMS evidence-index.json "luad-${version}-linux-x86_64.tar.gz" "luad-${version}-macos-aarch64.tar.gz" "luad-${version}.cdx.json" | LC_ALL=C sort)"
        for bundle in "${first}" "${second}"; do
          actual="$(find "${bundle}" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          test "${actual}" = "${expected}"
          cargo run --quiet -p luad-oracle --bin luad-release -- verify-bundle --repository "${GITHUB_WORKSPACE}" --bundle-dir "${bundle}"
        done
        for name in ${expected}; do
          cmp "${first}/${name}" "${second}/${name}"
        done

        probe="${RUNNER_TEMP}/release-bundle-corruption-probe"
        cp -R "${first}" "${probe}"
        printf '\000' | dd of="${probe}/luad-${version}-linux-x86_64.tar.gz" bs=1 seek=0 count=1 conv=notrunc status=none
        if cargo run --quiet -p luad-oracle --bin luad-release -- verify-bundle --repository "${GITHUB_WORKSPACE}" --bundle-dir "${probe}"; then
          echo "corrupted release bundle unexpectedly passed verification" >&2
          exit 1
        fi

        mkdir -p artifacts/release-bundle
        cp "${first}/"* artifacts/release-bundle/
        echo "LUAD_VERSION=${version}" >> "${GITHUB_ENV}"

    - name: Attest Release Archive Build Provenance
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: |
          artifacts/release-bundle/luad-*-linux-x86_64.tar.gz
          artifacts/release-bundle/luad-*-macos-aarch64.tar.gz

    - name: Attest Release SBOM
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/attest-sbom@v2
      with:
        subject-path: artifacts/release-bundle/luad-${{ env.LUAD_VERSION }}.cdx.json
        sbom-path: artifacts/release-bundle/luad-${{ env.LUAD_VERSION }}.cdx.json

    - name: Upload Diagnostic Release Bundle
      uses: actions/upload-artifact@v4
      with:
        name: release-bundle
        path: artifacts/release-bundle/
        if-no-files-found: error
        retention-days: 7

  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: [self-hosted, "${{ matrix.runner_os }}", "${{ matrix.runner_arch }}", "${{ matrix.runner_label }}"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner_os: Linux
            runner_arch: X64
            runner_label: luad-linux
          - os: macos-latest
            runner_os: macOS
            runner_arch: ARM64
            runner_label: luad-macos

    steps:
    - uses: actions/checkout@v4

    - name: Confirm Runner
      shell: bash
      run: |
        test "${RUNNER_OS}" = "${{ matrix.runner_os }}"
        test "${RUNNER_ARCH}" = "${{ matrix.runner_arch }}"

    - name: Set up MSRV
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.85.0

    - name: Build Locked Workspace
      run: cargo build --workspace --locked

    - name: Install and Smoke Locked CLI
      shell: bash
      run: |
        install_root="${RUNNER_TEMP}/luad-msrv-install"
        cargo install --path crates/luad-cli --locked --root "${install_root}"

        version_stderr="${RUNNER_TEMP}/luad-msrv-version.stderr"
        version_stdout="$("${install_root}/bin/luad" --version 2>"${version_stderr}")"
        expected_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
        test ! -s "${version_stderr}"
        test "${version_stdout}" = "luad ${expected_version}"

        capabilities="${RUNNER_TEMP}/luad-msrv-capabilities.json"
        capabilities_stderr="${RUNNER_TEMP}/luad-msrv-capabilities.stderr"
        "${install_root}/bin/luad" capabilities --format json \
          >"${capabilities}" 2>"${capabilities_stderr}"
        test ! -s "${capabilities_stderr}"
        python3 - "${expected_version}" "${capabilities}" <<'PY'
        import json
        import pathlib
        import sys

        expected_version = sys.argv[1]
        document = json.loads(pathlib.Path(sys.argv[2]).read_text())
        assert document["tool_name"] == "luad"
        assert document["tool_version"] == expected_version
        assert document["supported_dialects"] == []
        PY

    - name: Reject Rust Below MSRV
      if: runner.os == 'Linux'
      shell: bash
      run: |
        rustup toolchain install 1.84.1 --profile minimal
        lower_log="${RUNNER_TEMP}/luad-below-msrv.log"
        if rustup run 1.84.1 cargo build --workspace --locked >"${lower_log}" 2>&1; then
          cat "${lower_log}"
          echo "Rust 1.84.1 unexpectedly built the workspace" >&2
          exit 1
        fi
        cat "${lower_log}"
        if grep -Eq 'requires rustc 1\.85([^.0-9]|$)' "${lower_log}"; then
          exit 0
        fi
        grep -Fq 'feature `edition2024` is required' "${lower_log}"
        grep -Eq 'Cargo.*1\.84\.1' "${lower_log}"

  test:
    name: Test (${{ matrix.os }})
    runs-on: [self-hosted, "${{ matrix.runner_os }}", "${{ matrix.runner_arch }}", "${{ matrix.runner_label }}"]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runner_os: Linux
            runner_arch: X64
            runner_label: luad-linux
          - os: macos-latest
            runner_os: macOS
            runner_arch: ARM64
            runner_label: luad-macos

    steps:
    - uses: actions/checkout@v4

    - name: Confirm Runner
      shell: bash
      run: |
        test "${RUNNER_OS}" = "${{ matrix.runner_os }}"
        test "${RUNNER_ARCH}" = "${{ matrix.runner_arch }}"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        components: clippy, rustfmt

    - name: Install Official Lua Compilers
      run: ./scripts/install_ci_compilers.sh

    # Reads the same pins as a developer machine, narrowed to what this job installs.
    - name: Verify Bring-Up Prerequisites
      run: bash scripts/bringup.sh --doctor --scope ci-test

    - name: Run Contributor Checks
      run: ./scripts/check.sh

    - name: Run OpenWrt Lua 5.1 LNUM32 Authority Gate
      if: runner.os == 'Linux'
      run: ./scripts/gates/gate-authority-lua51-openwrt-lnum32.sh /tmp/gate-authority-lua51-openwrt-lnum32

  fuzz-smoke:
    name: Hostile Input Fuzz Smoke (Linux)
    runs-on: [self-hosted, Linux, X64, luad-linux]
    steps:
    - uses: actions/checkout@v4

    - name: Confirm Linux Runner
      shell: bash
      run: |
        test "${RUNNER_OS}" = "Linux"
        test "${RUNNER_ARCH}" = "X64"

    - name: Set up Rust Nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly-2026-08-25
        components: llvm-tools-preview

    - name: Install cargo-fuzz
      run: cargo +nightly-2026-08-25 install cargo-fuzz --version 0.13.2 --locked

    - name: Run Hostile-Input Fuzz Smoke Suite
      run: ./scripts/fuzz_smoke.sh artifacts/fuzz-smoke

    # A failed campaign is when this evidence matters most, and any crash reproducer
    # libFuzzer writes lands under fuzz/artifacts/.
    - name: Upload Fuzz Smoke Evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-smoke-evidence
        path: |
          artifacts/fuzz-smoke/
          fuzz/artifacts/
        if-no-files-found: warn
