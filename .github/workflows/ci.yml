name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        components: clippy, rustfmt

    - name: Install Official Lua Compilers
      run: ./scripts/install_ci_compilers.sh

    - name: Run Contributor Checks
      run: ./scripts/check.sh

    - name: Run OpenWrt Lua 5.1 LNUM32 Authority Gate
      if: runner.os == 'Linux'
      run: ./scripts/gates/gate-authority-lua51-openwrt-lnum32.sh /tmp/gate-authority-lua51-openwrt-lnum32

  qualify-candidate-platform:
    name: Qualify Candidate (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            target_triple: x86_64-unknown-linux-gnu
            build_host: github-actions:ubuntu-latest
          - platform: macos-aarch64
            runner: macos-latest
            os: macos
            arch: aarch64
            target_triple: aarch64-apple-darwin
            build_host: github-actions:macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        components: clippy, rustfmt

    - name: Install Official Lua Compilers
      run: ./scripts/install_ci_compilers.sh

    - name: Build Candidate Tool and Release Binary
      run: |
        cargo build -p luad-oracle --bin luad-candidate
        cargo build --release -p luad-cli --bin luad

    - name: Assemble Platform Candidate Archive
      run: |
        mkdir -p artifacts
        printf '{"version":"0.1.0","source_commit":"%s"}\n' "$(git rev-parse HEAD)" > artifacts/VERSION.json
        ./target/debug/luad-candidate pack \
          --spec tests/candidates/lua51-lnum32-rc1.json \
          --binary target/release/luad \
          --license LICENSE \
          --version-info artifacts/VERSION.json \
          --out-archive "artifacts/luad-${{ matrix.platform }}.tar.gz" \
          --out-ledger "artifacts/ledger-${{ matrix.platform }}.json"

    - name: Extract Archive and Qualify Extracted Binary
      run: |
        mkdir -p /tmp/candidate-extracted
        tar -xzf "artifacts/luad-${{ matrix.platform }}.tar.gz" -C /tmp/candidate-extracted
        export LUAD_CANDIDATE_BIN="/tmp/candidate-extracted/bin/luad"
        export LUAD_CANDIDATE_TOOL="${GITHUB_WORKSPACE}/target/debug/luad-candidate"

        # 1. Run the four canonical public gates
        ./scripts/gates/gate-authority-lua51-openwrt-lnum32.sh /tmp/results/gate-authority-lua51-openwrt-lnum32
        ./scripts/gates/gate-machine-contract.sh /tmp/results/gate-machine-contract
        ./scripts/gates/gate-public-disasm-lua51.sh /tmp/results/gate-public-disasm-lua51
        ./scripts/gates/gate-retrieval-contract-lua51.sh /tmp/results/gate-retrieval-contract-lua51

        # 2. Run aggregate checks
        ./scripts/check.sh

        # 3. Run candidate qualification gate
        ./scripts/gates/gate-candidate-lua51-lnum32.sh /tmp/results/gate-candidate-lua51-lnum32

        # 4. Generate and verify platform attestation
        mkdir -p artifacts
        SPEC_HASH=$(node -e 'const fs = require("fs"), crypto = require("crypto"); console.log(crypto.createHash("sha256").update(fs.readFileSync("tests/candidates/lua51-lnum32-rc1.json")).digest("hex"));')
        ARC_SHA=$(node -e 'const fs = require("fs"), crypto = require("crypto"); console.log(crypto.createHash("sha256").update(fs.readFileSync("artifacts/luad-${{ matrix.platform }}.tar.gz")).digest("hex"));')
        BIN_SHA=$(node -e 'const fs = require("fs"), crypto = require("crypto"); console.log(crypto.createHash("sha256").update(fs.readFileSync("target/release/luad")).digest("hex"));')
        COMMIT=$(git rev-parse HEAD)

        node -e '
        const fs = require("fs");
        const crypto = require("crypto");
        const ledger = JSON.parse(fs.readFileSync("artifacts/ledger-${{ matrix.platform }}.json", "utf8"));
        const prereqIds = [
          "gate-authority-lua51-openwrt-lnum32",
          "gate-machine-contract",
          "gate-public-disasm-lua51",
          "gate-retrieval-contract-lua51"
        ];
        const prereqs = prereqIds.map(id => {
          const res = JSON.parse(fs.readFileSync(`/tmp/results/${id}/gate-result.json`, "utf8"));
          const resHash = crypto.createHash("sha256").update(fs.readFileSync(`/tmp/results/${id}/gate-result.json`)).digest("hex");
          return {
            gate_id: id,
            spec_hash: res.spec_hash,
            result_sha256: resHash,
            exit_code: res.exit_code,
            success: res.success,
            passed_count: res.passed_count,
            failed_count: res.failed_count,
            ignored_count: res.ignored_count,
            missing_expected_tests: res.missing_expected_tests
          };
        });

        const attestation = {
          schema_version: 1,
          candidate_id: "lua51-lnum32-0.1.0-rc1",
          spec_hash: "'"$SPEC_HASH"'",
          git_commit: "'"$COMMIT"'",
          dirty: false,
          platform: "${{ matrix.platform }}",
          os: "${{ matrix.os }}",
          arch: "${{ matrix.arch }}",
          target_triple: "${{ matrix.target_triple }}",
          toolchain: "rustc 1.97.1",
          build_host: "${{ matrix.build_host }}",
          archive_path: "luad-${{ matrix.platform }}.tar.gz",
          archive_sha256: "'"$ARC_SHA"'",
          binary_sha256: "'"$BIN_SHA"'",
          member_ledger: ledger.members,
          target: {
            dialect: "lua5.1",
            patch_version: "Lua 5.1.5",
            profile: "lua5.1-lnum32",
            layout: "int=4,sizet=4,inst=4,num=8,endian=1,integral_flag=4"
          },
          prerequisite_results: prereqs,
          aggregate_check_success: true
        };
        fs.writeFileSync("artifacts/attestation-${{ matrix.platform }}.json", JSON.stringify(attestation, null, 2));
        '

        ./target/debug/luad-candidate verify-platform \
          --spec tests/candidates/lua51-lnum32-rc1.json \
          --attestation "artifacts/attestation-${{ matrix.platform }}.json" \
          --archive "artifacts/luad-${{ matrix.platform }}.tar.gz"

    - name: Upload Platform Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: candidate-${{ matrix.platform }}
        path: |
          artifacts/luad-${{ matrix.platform }}.tar.gz
          artifacts/attestation-${{ matrix.platform }}.json

  qualify-candidate-index:
    name: Assemble and Verify Candidate Index
    needs: qualify-candidate-platform
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1

    - name: Download Linux Artifacts
      uses: actions/download-artifact@v4
      with:
        name: candidate-linux-x86_64
        path: artifacts

    - name: Download macOS Artifacts
      uses: actions/download-artifact@v4
      with:
        name: candidate-macos-aarch64
        path: artifacts

    - name: Build Candidate Tool
      run: cargo build -p luad-oracle --bin luad-candidate

    - name: Assemble and Verify Candidate Evidence Index
      run: |
        ./target/debug/luad-candidate assemble-index \
          --spec tests/candidates/lua51-lnum32-rc1.json \
          --artifact-root artifacts \
          --attestation artifacts/attestation-linux-x86_64.json \
          --attestation artifacts/attestation-macos-aarch64.json \
          --out artifacts/candidate-index.json

        ./target/debug/luad-candidate verify-index \
          --spec tests/candidates/lua51-lnum32-rc1.json \
          --artifact-root artifacts \
          --index artifacts/candidate-index.json

    - name: Upload Complete Candidate Evidence Bundle
      uses: actions/upload-artifact@v4
      with:
        name: candidate-evidence-bundle
        path: artifacts/
