name: Release Publication

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full lowercase source revision already accepted by main CI
        required: true
        type: string
      ci_run_id:
        description: Successful main CI run containing the accepted release bundle
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  rehearse:
    name: Rehearse Release Publication
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.revision }}
        fetch-depth: 0

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1

    - name: Publish, Verify, and Withdraw Rehearsal Probes
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/release-publication.sh rehearse '${{ inputs.revision }}' '${{ inputs.ci_run_id }}'
