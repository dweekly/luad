name: Release Publication

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publication mode (rehearse or publish)
        required: true
        default: rehearse
        type: choice
        options:
        - rehearse
        - publish
      revision:
        description: Full lowercase source revision already accepted by main CI
        required: true
        type: string
      ci_run_id:
        description: Successful main CI run containing the accepted release bundle
        required: true
        type: string

permissions:
  actions: read
  contents: write
  attestations: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publication:
    name: Release Publication (${{ inputs.mode }})
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, luad-linux]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.revision }}
        fetch-depth: 0

    - name: Confirm Linux Runner
      shell: bash
      run: |
        test "${RUNNER_OS}" = "Linux"
        test "${RUNNER_ARCH}" = "X64"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1

    - name: Execute Publication Workflow
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/release-publication.sh '${{ inputs.mode }}' '${{ inputs.revision }}' '${{ inputs.ci_run_id }}'
