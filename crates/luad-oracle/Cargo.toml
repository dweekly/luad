[package]
name = "luad-oracle"
description = "Independent compiler-oracle, qualification, and release verification tools for luad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
lnum32-authority-gate = []

[dependencies]
luad-core = { workspace = true }
luad-dialect-lua54 = { workspace = true }
luad-dialect-lua55 = { workspace = true }
luad-dialect-lua53 = { workspace = true }
luad-dialect-lua52 = { workspace = true }
luad-dialect-lua51 = { workspace = true }
luad-analysis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tempfile = "3.10"
proptest = "1.4"
thiserror = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
jsonschema = { version = "0.51.0", default-features = false }

[[bin]]
name = "run_gate"
path = "src/bin/run_gate.rs"

[[bin]]
name = "luad-candidate"
path = "src/bin/luad_candidate.rs"

[[bin]]
name = "luad-release"
path = "src/bin/luad_release.rs"
